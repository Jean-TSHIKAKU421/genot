admin.html
========================================== -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - GeNot</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){const t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="bg-particles"><div class="particle particle-1"></div><div class="particle particle-2"></div><div class="particle particle-3"></div><div class="bg-grid"></div></div>
    <div class="admin-container">
        <header class="admin-header">
            <button class="btn-back" onclick="window.location.href='/'"><i class="fas fa-arrow-left"></i> Sortir</button>
            <h1>🛡️ Admin Panel</h1>
            <button class="btn-refresh" onclick="loadStats()"><i class="fas fa-sync"></i></button>
        </header>

        <div class="admin-tabs">
            <button class="tab active" onclick="switchTab('dashboard', this)"><i class="fas fa-chart-pie"></i> Dashboard</button>
            <button class="tab" onclick="switchTab('visits', this)"><i class="fas fa-chart-line"></i> Visites</button>
            <button class="tab" onclick="switchTab('sql', this)"><i class="fas fa-database"></i> SQL</button>
        </div>

        <div id="tab-dashboard" class="tab-content active">
            <div class="stats-grid">
                <div class="stat-card" style="border-left:4px solid #6366f1;"><span class="stat-number" id="statUsers">0</span><span class="stat-label">Utilisateurs</span></div>
                <div class="stat-card" style="border-left:4px solid #10b981;"><span class="stat-number" id="statCourses">0</span><span class="stat-label">Cours</span></div>
                <div class="stat-card" style="border-left:4px solid #f59e0b;"><span class="stat-number" id="statNotes">0</span><span class="stat-label">Notes</span></div>
                <div class="stat-card" style="border-left:4px solid #ef4444;"><span class="stat-number" id="statPdfs">0</span><span class="stat-label">PDFs</span></div>
                <div class="stat-card" style="border-left:4px solid #06b6d4;"><span class="stat-number" id="statLinks">0</span><span class="stat-label">Liens</span></div>
            </div>
        </div>

        <div id="tab-visits" class="tab-content">
            <div class="stats-row">
                <div class="stat-card"><span class="stat-number" id="visTotal">0</span><span class="stat-label">Total</span></div>
                <div class="stat-card"><span class="stat-number" id="visToday">0</span><span class="stat-label">Aujourd'hui</span></div>
                <div class="stat-card"><span class="stat-number" id="visWeek">0</span><span class="stat-label">7 jours</span></div>
            </div>

            <h3 class="section-title"><i class="fas fa-globe"></i> Plateformes</h3>
            <div class="platform-cards">
                <div class="platform-card web">
                    <div class="platform-header"><i class="fas fa-globe"></i><span>Web</span></div>
                    <div class="platform-count" id="platWeb">0</div>
                    <div class="platform-bar"><div class="platform-fill web-fill" id="webFill"></div></div>
                    <div class="platform-pct" id="webPct">0%</div>
                </div>
                <div class="platform-card mobile">
                    <div class="platform-header"><i class="fas fa-mobile-alt"></i><span>Mobile</span></div>
                    <div class="platform-count" id="platMobile">0</div>
                    <div class="platform-bar"><div class="platform-fill mobile-fill" id="mobileFill"></div></div>
                    <div class="platform-pct" id="mobilePct">0%</div>
                </div>
            </div>

            <h3 class="section-title"><i class="fas fa-calendar-alt"></i> 30 derniers jours</h3>
            <div class="chart-card">
                <canvas id="visitsChart"></canvas>
            </div>
        </div>

        <div id="tab-sql" class="tab-content">
            <div class="sql-area">
                <textarea id="sqlQuery" placeholder="SELECT * FROM users..." class="sql-input"></textarea>
                <button class="btn btn-submit" onclick="executeSQL()" id="sqlBtn"><i class="fas fa-play"></i> Exécuter</button>
                <div id="sqlError" class="alert alert-error" style="display:none;"></div>
                <div id="sqlResult" style="margin-top:16px;"></div>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script>
        // ==========================================
        // ADMIN DASHBOARD
        // ==========================================
        function switchTab(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'visits') loadVisits();
        }

        async function loadStats() {
            try { const r = await fetch('/api/admin/stats'); const d = await r.json(); if (d.success && d.stats) { document.getElementById('statUsers').textContent = d.stats.users; document.getElementById('statCourses').textContent = d.stats.courses; document.getElementById('statNotes').textContent = d.stats.notes; document.getElementById('statPdfs').textContent = d.stats.pdfs; document.getElementById('statLinks').textContent = d.stats.links; } } catch (e) {}
        }

        async function loadVisits() {
            try { const r = await fetch('/api/admin/visits'); const d = await r.json(); if (d.success) { document.getElementById('visTotal').textContent = d.total; document.getElementById('visToday').textContent = d.today; document.getElementById('visWeek').textContent = d.week; const wc = d.platforms?.find(p => p.platform === 'web')?.count || 0; const mc = d.platforms?.find(p => p.platform === 'mobile')?.count || 0; document.getElementById('platWeb').textContent = wc; document.getElementById('platMobile').textContent = mc; const wp = d.total > 0 ? Math.round((wc / d.total) * 100) : 0; const mp = d.total > 0 ? Math.round((mc / d.total) * 100) : 0; document.getElementById('webFill').style.width = wp + '%'; document.getElementById('mobileFill').style.width = mp + '%'; document.getElementById('webPct').textContent = wp + '%'; document.getElementById('mobilePct').textContent = mp + '%'; drawChart(d.daily || []); } } catch (e) {}
        }

        let chartInstance = null;
        function drawChart(daily) {
            const ctx = document.getElementById('visitsChart'); if (!ctx) return;
            if (chartInstance) chartInstance.destroy();
            const labels = daily.map(d => { const dt = new Date(d.date); return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }); });
            const data = daily.map(d => d.count);
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels, datasets: [{ data, backgroundColor: '#6366f1', borderRadius: 6, barThickness: 18 }] },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: isDark ? '#94a3b8' : '#64748b', font: { size: 10 } }, grid: { display: false } },
                        y: { beginAtZero: true, ticks: { color: isDark ? '#94a3b8' : '#64748b', font: { size: 10 }, stepSize: 1 }, grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } }
                    }
                }
            });
        }

        async function executeSQL() {
            const query = document.getElementById('sqlQuery').value.trim(); if (!query) return;
            document.getElementById('sqlBtn').disabled = true; document.getElementById('sqlBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i> Exécution...';
            document.getElementById('sqlError').style.display = 'none'; document.getElementById('sqlResult').innerHTML = '';
            try { const r = await fetch('/api/admin/sql', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query }) }); const d = await r.json(); if (d.success) { document.getElementById('sqlResult').innerHTML = `<p style="color:#10b981;margin-bottom:12px;">${d.data.length} résultat(s)</p><div class="sql-table"><table>${d.data.slice(0,50).map(row => '<tr>' + Object.values(row).map(v => '<td>' + (v !== null ? v : '<i>NULL</i>') + '</td>').join('') + '</tr>').join('')}</table></div>`; } else { document.getElementById('sqlError').style.display = 'block'; document.getElementById('sqlError').textContent = d.message; } } catch (e) { document.getElementById('sqlError').style.display = 'block'; document.getElementById('sqlError').textContent = 'Erreur de connexion.'; }
            document.getElementById('sqlBtn').disabled = false; document.getElementById('sqlBtn').innerHTML = '<i class="fas fa-play"></i> Exécuter';
        }

        loadStats();
    </script>
</body>
</html>
