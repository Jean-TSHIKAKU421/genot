<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - GeNot</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){const t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
</head>
<body>
    <div class="bg-particles"><div class="particle particle-1"></div><div class="particle particle-2"></div><div class="particle particle-3"></div><div class="bg-grid"></div></div>
    <div class="admin-container">
        <header class="admin-header">
            <button class="btn-back" onclick="window.location.href='/'"><i class="fas fa-arrow-left"></i> Sortir</button>
            <h1><i class="fas fa-shield-halved"></i> Admin Panel</h1>
            <button class="btn-refresh" onclick="loadAll()"><i class="fas fa-sync"></i></button>
            <button id="theme-toggle" class="theme-toggle-btn"><span class="icon-sun">☀️</span><span class="icon-moon">🌙</span></button>
        </header>
        <div class="admin-tabs">
            <button class="tab active" onclick="switchTab('dashboard')"><i class="fas fa-chart-pie"></i> Dashboard</button>
            <button class="tab" onclick="switchTab('visits')"><i class="fas fa-chart-line"></i> Visites</button>
            <button class="tab" onclick="switchTab('sql')"><i class="fas fa-database"></i> SQL</button>
            <button class="tab" onclick="switchTab('logs')"><i class="fas fa-history"></i> Logs</button>
        </div>
        <div id="dashboard" class="tab-content active"><div class="stats-grid" id="statsGrid"></div></div>
        <div id="visits" class="tab-content">
            <div class="stats-row" id="visitsStats"></div>
            <h3 class="section-title"><i class="fas fa-globe"></i> Plateformes</h3>
            <div class="platforms-row" id="platformsRow"></div>
            <h3 class="section-title"><i class="fas fa-calendar-alt"></i> Fréquentation mensuelle</h3>
            <div class="month-selector">
                <div class="selector-group"><label>Mois :</label><select id="chartMonth" onchange="loadMonthlyVisits()"><option value="1">Janvier</option><option value="2">Février</option><option value="3">Mars</option><option value="4">Avril</option><option value="5">Mai</option><option value="6">Juin</option><option value="7">Juillet</option><option value="8">Août</option><option value="9">Septembre</option><option value="10">Octobre</option><option value="11">Novembre</option><option value="12">Décembre</option></select></div>
                <div class="selector-group"><label>Année :</label><select id="chartYear" onchange="loadMonthlyVisits()"><option value="2026">2026</option><option value="2025">2025</option></select></div>
            </div>
            <div class="chart-card"><canvas id="monthlyChart"></canvas></div>
            <div id="noDataMessage" style="display:none;text-align:center;padding:30px;color:var(--text-secondary);"><i class="fas fa-info-circle" style="font-size:40px;margin-bottom:12px;display:block;"></i>Aucune donnée pour ce mois.</div>
        </div>
        <div id="sql" class="tab-content">
            <div class="sql-area">
                <textarea id="sqlQuery" placeholder="SELECT * FROM users..." class="sql-input"></textarea>
                <div style="display:flex;gap:10px;"><button class="btn btn-submit" onclick="executeSQL()" id="sqlBtn"><i class="fas fa-play"></i> Exécuter</button><button class="btn btn-secondary" onclick="clearSQL()"><i class="fas fa-broom"></i> Nettoyer</button></div>
                <div id="sqlError" class="alert alert-error" style="display:none;"></div>
                <div id="sqlResult" style="margin-top:16px;"></div>
            </div>
        </div>
        <div id="logs" class="tab-content">
            <div class="logs-area">
                <div class="logs-filters">
                    <div class="selector-group"><label>Type :</label>
                        <div class="input-wrapper select-wrapper" style="min-width:160px;">
                            <i class="fas fa-tag input-icon"></i>
                            <select id="logType" onchange="loadLogs()" style="padding-left:40px;">
                                <option value="">Tous les types</option>
                                <option value="login">Connexion</option>
                                <option value="login_failed">Échec connexion</option>
                                <option value="logout">Déconnexion</option>
                                <option value="course_create">Cours créé</option>
                                <option value="course_update">Cours modifié</option>
                                <option value="course_delete">Cours supprimé</option>
                                <option value="note_create">Note créée</option>
                                <option value="note_update">Note modifiée</option>
                                <option value="note_delete">Note supprimée</option>
                                <option value="file_upload">Fichier uploadé</option>
                                <option value="admin_access">Accès admin</option>
                                <option value="totp_failed">TOTP échoué</option>
                                <option value="error">Erreur</option>
                            </select>
                            <i class="fas fa-chevron-down select-arrow"></i>
                        </div>
                    </div>
                    <div class="selector-group"><label>Début :</label><div class="input-wrapper"><i class="fas fa-calendar input-icon"></i><input type="date" id="logStartDate" onchange="loadLogs()"></div></div>
                    <div class="selector-group"><label>Fin :</label><div class="input-wrapper"><i class="fas fa-calendar input-icon"></i><input type="date" id="logEndDate" onchange="loadLogs()"></div></div>
                    <button class="btn btn-submit btn-sm" onclick="loadLogs()"><i class="fas fa-search"></i></button>
                    <button class="btn btn-secondary btn-sm" onclick="clearLogFilters()"><i class="fas fa-broom"></i></button>
                </div>
                <div class="logs-info" id="logsInfo"></div>
                <div class="logs-table-container"><table class="logs-table" id="logsTable"><thead><tr><th style="width:140px">Date</th><th style="width:100px">Type</th><th style="width:120px">Utilisateur</th><th style="width:100px">IP</th><th>Détails</th></tr></thead><tbody id="logsBody"><tr><td colspan="5" style="text-align:center;padding:30px;">Chargement...</td></tr></tbody></table></div>
                <div class="logs-pagination" id="logsPagination"></div>
            </div>
        </div>
    </div>

    <div id="totpModal" class="modal-overlay" style="display:none;z-index:10000;">
        <div class="modal-card" style="max-width:380px;">
            <div class="modal-header"><h2><i class="fas fa-shield-halved"></i> Vérification TOTP</h2></div>
            <div class="modal-body" style="text-align:center;padding:24px;">
                <p style="margin-bottom:16px;color:var(--text-secondary);">Entrez le code à 6 chiffres de Google Authenticator</p>
                <div class="input-wrapper" style="margin-bottom:12px;"><i class="fas fa-key input-icon"></i><input type="text" id="totpInput" placeholder="000000" maxlength="6" style="text-align:center;font-size:1.5em;letter-spacing:8px;padding-left:44px;" autocomplete="off"></div>
                <div id="totpError" class="alert alert-error" style="display:none;"></div>
                <button class="btn btn-submit" onclick="verifyTOTP()" style="width:100%;margin-top:8px;"><i class="fas fa-check"></i> Vérifier</button>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/admin.js"></script>
    <script>const now=new Date();document.getElementById('chartMonth').value=now.getMonth()+1;document.getElementById('chartYear').value=now.getFullYear();</script>
    <script src="js/animations.js"></script>
    <script src="js/modal.js"></script>
</body>
</html>
