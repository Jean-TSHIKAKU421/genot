<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GeNot</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="bg-particles">
        <div class="particle particle-1"></div>
        <div class="particle particle-2"></div>
        <div class="particle particle-3"></div>
        <div class="bg-grid"></div>
    </div>

    <div class="admin-container">
        <header class="admin-header">
            <a href="/home" class="btn-back"><i class="fas fa-arrow-left"></i> Retour</a>
            <h1>🛡️ Admin Panel</h1>
            <div style="display:flex;align-items:center;gap:8px;">
                <button id="theme-toggle" class="theme-toggle-btn">
                    <span class="icon-sun">☀️</span>
                    <span class="icon-moon">🌙</span>
                </button>
                <button onclick="loadAll()" class="btn-refresh"><i class="fas fa-sync"></i></button>
            </div>
        </header>

        <div class="admin-tabs">
            <button class="tab active" onclick="switchTab('dashboard')">Dashboard</button>
            <button class="tab" onclick="switchTab('visits')">Visites</button>
            <button class="tab" onclick="switchTab('sql')">SQL</button>
        </div>

        <div id="dashboard" class="tab-content active">
            <div class="stats-grid" id="statsGrid"></div>
        </div>

        <div id="visits" class="tab-content">
            <div class="visits-stats" id="visitsStats"></div>
            <div class="platforms-row" id="platformsRow"></div>
            <h3>📅 30 derniers jours</h3>
            <div class="chart-bar" id="dailyChart"></div>
        </div>

        <div id="sql" class="tab-content">
            <textarea id="sqlQuery" placeholder="SELECT * FROM users..."></textarea>
            <button onclick="executeSQL()" class="btn-primary">Exécuter</button>
            <pre id="sqlResult"></pre>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
