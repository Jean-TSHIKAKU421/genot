<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accueil - GeNot</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){const t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
</head>
<body>
    <div class="bg-particles"><div class="particle particle-1"></div><div class="particle particle-2"></div><div class="particle particle-3"></div><div class="bg-grid"></div></div>
    <div class="home-container">
        <header class="home-header">
            <div class="header-top">
                <div class="header-logo"><div class="logo-wrapper"><img src="assets/images/logo.png" alt="GeNot" class="logo-img"></div></div>
                <div class="header-user-name" id="header-user-name"></div>
                <div class="header-profile" id="header-profile" onclick="window.location.href='/settings'"></div>
            </div>
            <div class="header-actions">
                <a href="/settings" class="btn btn-secondary btn-sm"><i class="fas fa-cog"></i> <span class="btn-label">Paramètres</span></a>
                <a href="/trash" class="btn btn-secondary btn-sm"><i class="fas fa-trash-alt"></i> <span class="btn-label">Corbeille</span></a>
                <button id="theme-toggle" class="theme-toggle-btn"><span class="icon-sun">☀️</span><span class="icon-moon">🌙</span></button>
                <button class="btn btn-secondary btn-sm" id="logout-btn"><i class="fas fa-sign-out-alt"></i> <span class="btn-label">Quitter</span></button>
            </div>
        </header>
        <div id="welcomeToast" class="welcome-toast"><span class="toast-icon"></span><span class="toast-text" id="toastText"></span></div>
        <h2 class="home-title"><i class="fas fa-book"></i> Mes Cours</h2>
        <div class="search-bar-home"><i class="fas fa-search search-icon"></i><input type="text" id="homeSearchInput" placeholder="Rechercher un cours..."><button class="btn-search-clear" id="homeClearSearch" style="display:none;" onclick="clearHomeSearch()"><i class="fas fa-times"></i></button></div>
        <div id="no-courses" class="empty-state" style="display:none;"><div class="empty-icon"><i class="fas fa-book-open"></i></div><h2>Aucun cours pour le moment</h2><p>Commencez par ajouter votre premier cours !</p><button onclick="showAddCourseModal()" class="btn btn-submit btn-large"><i class="fas fa-plus"></i> Ajouter un cours</button></div>
        <div id="courses-grid" class="courses-grid"></div>
        <div id="add-course-bottom" class="add-course-section"><button onclick="showAddCourseModal()" class="btn btn-submit btn-large"><i class="fas fa-plus"></i> Ajouter un cours</button></div>
    </div>

    <div id="add-course-modal" class="modal-overlay" style="display:none;">
        <div class="modal-card"><div class="modal-header"><h2>Ajouter un cours</h2><button class="modal-close" onclick="closeAddCourseModal()"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><form id="add-course-form">
            <div class="form-group"><label class="form-label">Titre du cours <span class="required">*</span></label><div class="input-wrapper"><i class="fas fa-book input-icon"></i><input type="text" id="course-title" placeholder="Titre du cours" required></div></div>
            <div class="form-group"><label class="form-label">Professeur <span class="optional">(optionnel)</span></label><div class="input-wrapper"><i class="fas fa-user-tie input-icon"></i><input type="text" id="course-professor" placeholder="Nom du professeur"></div></div>
            <div class="form-group"><label class="form-label">Description <span class="optional">(optionnel)</span></label><div class="input-wrapper"><i class="fas fa-align-left input-icon"></i><textarea id="course-description" rows="3" placeholder="Description du cours..."></textarea></div></div>
            <div class="form-group"><label class="form-label">Image <span class="optional">(optionnel)</span></label><div class="input-wrapper"><i class="fas fa-image input-icon"></i><input type="file" id="course-image" accept="image/*"></div><small class="hint">JPG, PNG, GIF, WEBP - Max 5MB</small></div>
            <div class="modal-footer"><button type="button" class="btn btn-secondary" onclick="closeAddCourseModal()">Annuler</button><button type="submit" class="btn btn-submit"><i class="fas fa-plus"></i> Ajouter</button></div>
        </form></div></div>
    </div>

    <div id="courseDetailModal" class="modal-overlay" style="display:none;">
        <div class="modal-card modal-course-detail"><div class="modal-header"><h2 id="modalCourseTitle">Détails</h2><button class="modal-close" onclick="closeCourseDetail()"><i class="fas fa-times"></i></button></div>
        <div class="modal-body"><div id="viewMode">
            <div class="course-detail-image-wrapper"><img id="detailCourseImage" src="" class="course-detail-image"><div id="detailNoImage" class="course-detail-no-image" style="display:none;"><i class="fas fa-book"></i></div></div>
            <div class="course-detail-info"><div class="detail-row"><span class="detail-label"><i class="fas fa-book"></i> Titre</span><span class="detail-value" id="detailTitle"></span></div><div class="detail-row"><span class="detail-label"><i class="fas fa-user-tie"></i> Professeur</span><span class="detail-value" id="detailProfessor"></span></div><div class="detail-row"><span class="detail-label"><i class="fas fa-calendar"></i> Créé le</span><span class="detail-value" id="detailDate"></span></div><div class="detail-row full-width"><span class="detail-label"><i class="fas fa-align-left"></i> Description</span><p class="detail-value" id="detailDescription"></p></div></div>
            <div class="detail-actions"><button class="btn btn-secondary" onclick="deleteCourseFromDetail()"><i class="fas fa-trash"></i> Supprimer</button><button class="btn btn-submit" onclick="switchToEditMode()"><i class="fas fa-edit"></i> Modifier</button></div>
        </div>
        <div id="editMode" style="display:none;"><form id="editCourseForm">
            <div class="form-group"><label class="form-label">Titre <span class="required">*</span></label><div class="input-wrapper"><i class="fas fa-book input-icon"></i><input type="text" id="editCourseTitle" required></div></div>
            <div class="form-group"><label class="form-label">Professeur</label><div class="input-wrapper"><i class="fas fa-user-tie input-icon"></i><input type="text" id="editProfessor"></div></div>
            <div class="form-group"><label class="form-label">Description</label><div class="input-wrapper"><i class="fas fa-align-left input-icon"></i><textarea id="editDescription" rows="3"></textarea></div></div>
            <div class="form-group"><label class="form-label">Image</label><div class="input-wrapper"><i class="fas fa-image input-icon"></i><input type="file" id="editCourseImage" accept="image/*"></div></div>
        </form><div class="detail-actions"><button class="btn btn-secondary" onclick="switchToViewMode()">Annuler</button><button class="btn btn-submit" onclick="saveCourseChanges()">Enregistrer</button></div></div></div></div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/home.js"></script>
    <script>(function(){fetch('/api/visits',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'web',page:'home'})}).catch(()=>{});})();</script>
    <script src="js/animations.js"></script>
    <script src="js/modal.js"></script>
</body>
</html>
