<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffre-fort - GeNot</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/vault.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>(function(){const t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
</head>
<body>
    <div class="bg-particles"><div class="particle particle-1"></div><div class="particle particle-2"></div><div class="particle particle-3"></div><div class="bg-grid"></div></div>

    <!-- Écran mot de passe -->
    <div id="vaultLogin" class="vault-login-container">
        <div class="vault-login-card">
            <div class="vault-icon">🔒</div>
            <h1>Coffre-fort</h1>
            <p>Entrez votre mot de passe pour accéder au coffre-fort</p>
            <div class="input-wrapper"><i class="fas fa-lock input-icon"></i><input type="password" id="vaultPassword" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')unlockVault()"></div>
            <div id="vaultError" class="alert alert-error" style="display:none;"></div>
            <button class="btn btn-submit" onclick="unlockVault()"><i class="fas fa-unlock"></i> Déverrouiller</button>
            <a href="/home" class="vault-back-link">← Retour à l'accueil</a>
        </div>
    </div>

    <!-- Contenu du coffre -->
    <div id="vaultContent" class="vault-container" style="display:none;">
        <header class="vault-header">
            <button class="btn-back" onclick="window.location.href='/home'"><i class="fas fa-arrow-left"></i></button>
            <h1>🔒 Coffre-fort</h1>
            <span id="vaultCount" class="vault-count"></span>
        </header>

        <div class="vault-tabs">
            <button class="tab active" onclick="switchVaultTab('courses')">📚 Cours masqués</button>
            <button class="tab" onclick="switchVaultTab('data')">📄 Données masquées</button>
        </div>

        <div id="vaultCourses" class="vault-tab-content active">
            <div id="vaultCoursesList"></div>
            <div id="noVaultCourses" class="empty-state" style="display:none;"><span class="empty-icon">📭</span><p>Aucun cours masqué</p></div>
        </div>

        <div id="vaultData" class="vault-tab-content">
            <div id="vaultDataList"></div>
            <div id="noVaultData" class="empty-state" style="display:none;"><span class="empty-icon">📭</span><p>Aucune donnée masquée</p></div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/vault.js"></script>
    <script src="js/modal.js"></script>
</body>
</html>
